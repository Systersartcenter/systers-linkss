.bg-overlay{position:fixed;inset:0;z-index:1;background:rgba(20,10,4,0.58);}
.container{max-width:400px;width:100%;position:relative;z-index:2;}
.header{text-align:center;margin-bottom:2rem;animation:fadeUp .7s ease both;}
.logo-wrap{margin:0 auto 1.2rem;width:115px;height:115px;border-radius:50%;border:1.5px solid rgba(184,148,90,.6);padding:7px;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.25);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);}
.logo-wrap img{width:100%;height:100%;object-fit:contain;border-radius:50%;}
.tagline{font-size:.7rem;font-weight:300;letter-spacing:.22em;text-transform:uppercase;color:rgba(255,255,255,.65);margin-top:.45rem;}
.divider{width:36px;height:1px;background:var(--gold);margin:.8rem auto 0;opacity:.7;}
.links{display:flex;flex-direction:column;gap:10px;}
.link-item{display:flex;align-items:center;gap:14px;padding:14px 20px;background:rgba(255,255,255,.12);border:.5px solid rgba(255,255,255,.22);border-radius:4px;text-decoration:none;color:#fff;transition:background .22s,border-color .22s,transform .18s;animation:fadeUp .7s ease both;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);}
.link-item:nth-child(1){animation-delay:.15s;}
.link-item:nth-child(2){animation-delay:.25s;}
.link-item:nth-child(3){animation-delay:.35s;}
.link-item:nth-child(4){animation-delay:.45s;}
.link-item:nth-child(5){animation-delay:.55s;}
.link-item:nth-child(6){animation-delay:.65s;}
.link-item:hover{background:rgba(255,255,255,.22);border-color:rgba(184,148,90,.6);transform:translateY(-2px);}
.link-icon{width:40px;height:40px;flex-shrink:0;border-radius:10px;overflow:hidden;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.15);}
.link-icon img{width:100%;height:100%;object-fit:contain;}
.link-icon.round{border-radius:50%;}
.link-text{flex:1;}
.link-label{font-size:.67rem;font-weight:300;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.5);display:block;margin-bottom:1px;}
.link-name{font-family:'Cormorant Garamond',serif;font-size:1.1rem;font-weight:400;color:#fff;letter-spacing:.02em;}
.link-arrow{color:var(--gold);opacity:.7;transition:opacity .2s,transform .2s;flex-shrink:0;}
.link-item:hover .link-arrow{opacity:1;transform:translateX(3px);}
.footer{text-align:center;margin-top:2rem;font-size:.67rem;letter-spacing:.15em;text-transform:uppercase;color:rgba(255,255,255,.35);animation:fadeUp .8s .7s ease both;}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
</style>
</head>
